
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Geo Finder</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
}
.container {
  width: 85%;
  max-width: 350px;
  padding: 28px;
  text-align: center;
  background: #1e293b;
  border-radius: 20px;
}
h1 { color: #38bdf8; }
p { line-height: 1.6; color: #cbd5e1; }
button {
  width: 100%;
  padding: 14px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}
.allow { background: #16a34a; color: white; }
.deny { background: #475569; color: white; }
#result { overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="container">
  <h1>Thank You! ❤️</h1>
  <p>Thanks for visiting.<br>Have a wonderful day!</p>
  <h3>Would you like to share your location? 📍</h3>
  <p>Your location will only be shared with your permission.</p>

  <button class="allow" onclick="shareLocation()">
    Allow Location
  </button>
  <button class="deny" onclick="decline()">
    Don't Allow
  </button>
  <p id="result"></p>
</div>

<script>
function shareLocation() {
  const result = document.getElementById("result");

  if (!navigator.geolocation) {
    result.textContent = "Location is not supported.";
    return;
  }

  result.textContent = "Waiting for your permission...";

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      result.innerHTML =
        "Location shared with your permission!<br>" +
        '<a style="color:#38bdf8" target="_blank" rel="noopener" href="https://www.google.com/maps?q=' +
        lat + ',' + lon + '">View on Google Maps</a>';
    },
    function() {
      result.textContent =
        "Location permission was not granted.";
    }
  );
}

function decline() {
  document.getElementById("result").textContent =
    "No problem! Thanks for visiting. Goodbye! 👋";
}
</script>
  
<div style="padding:20px;text-align:center;">
  <h3>Share Your Location</h3>

  <p>
    If you agree, your current location will be
    sent to the website owner through Telegram.
  </p>

  <label>
    <input type="checkbox" id="consent">
    I agree to share my location.
  </label>

  <br><br>

  <button onclick="shareLocation()">
    Share My Location
  </button>

  <p id="status"></p>
</div>

<script>
async function shareLocation() {
  const status = document.getElementById("status");

  if (!document.getElementById("consent").checked) {
    status.innerText = "Please agree before sharing.";
    return;
  }

  if (!navigator.geolocation) {
    status.innerText = "Location is not supported.";
    return;
  }

  status.innerText = "Waiting for location permission...";

  navigator.geolocation.getCurrentPosition(async function(pos) {
    status.innerText = "Submitting your location...";

    const data = {
      consent: true,
      latitude: pos.coords.latitude,
      longitude: pos.coords.longitude,
      pageUrl: location.href
    };

    try {
      await fetch("PASTE_YOUR_WEB_APP_URL_HERE", {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(data)
      });

      status.innerText =
        "Request submitted. Thank you for sharing!";

    } catch (error) {
      status.innerText = "Could not submit. Please try again.";
    }

  }, function() {
    status.innerText = "Location permission was not granted.";
  });
}
</script>
  
</body>
</html>
